<!DOCTYPE html>
<html>
<head><title>Generate Grafite Icons</title></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawIcon(id, size) {
  const c = document.getElementById(id)
  const ctx = c.getContext('2d')
  const r = size * 0.18

  // Background
  ctx.fillStyle = '#111210'
  ctx.beginPath()
  ctx.roundRect(0, 0, size, size, r)
  ctx.fill()

  // Letter G in amber serif
  ctx.fillStyle = '#E8A547'
  ctx.font = `${size * 0.58}px Georgia, serif`
  ctx.textAlign = 'center'
  ctx.textBaseline = 'middle'
  ctx.fillText('G', size / 2, size * 0.52)

  return c.toDataURL('image/png')
}

const d192 = drawIcon('c192', 192)
const d512 = drawIcon('c512', 512)

// Show download links
document.body.innerHTML += `<br><a href="${d192}" download="icon-192.png">Download 192x192</a><br>`
document.body.innerHTML += `<a href="${d512}" download="icon-512.png">Download 512x512</a>`
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="36" fill="#111210"/>
  <!-- Notebook outline -->
  <rect x="44" y="32" width="104" height="128" rx="14" fill="none" stroke="#E8A547" stroke-width="4"/>
  <!-- Title line (thick) -->
  <line x1="62" y1="58" x2="130" y2="58" stroke="#E8A547" stroke-width="6" stroke-linecap="round"/>
  <!-- Content lines -->
  <line x1="62" y1="84" x2="130" y2="84" stroke="#E8A547" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="62" y1="106" x2="130" y2="106" stroke="#E8A547" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="62" y1="128" x2="100" y2="128" stroke="#E8A547" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
  <!-- Pencil dot accent -->
  <circle cx="130" cy="148" r="6" fill="#E8A547"/>
</svg>
